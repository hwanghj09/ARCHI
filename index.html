      .room-door.blinds { border-color: #4f4a44; background: radial-gradient(circle at 84% 58%, #0a0a0a 0 3px, transparent 4px), linear-gradient(90deg, transparent 80%, #b9b2a4 80% 85%, transparent 85%), repeating-linear-gradient(#59616b 0 6px, #373d44 6px 8px, #1f2328 8px 11px); box-shadow: inset 0 0 0 4px #1a1c1f; }
