<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <style>

      .floor-room::before { content: ''; position: absolute; top: 34px; left: 28px; right: 28px; height: 190px; border: 5px solid #2f3d43; background: radial-gradient(circle, #c9b77a55 0 1.5px, transparent 2px) 0 60px / 26px 22px, linear-gradient(transparent 38%, #0b1116 38%), linear-gradient(#0c1a2b, #16273a); }
      .floor-room-sign { position: absolute; top: -40px; left: 50%; transform: translateX(-50%); padding: 3px 12px; border: 2px solid #3d4e52; background: #0d1417; color: #a9bfb6; font: bold 15px Arial, sans-serif; white-space: nowrap; }
      .floor-number-sign { position: absolute; top: 150px; width: 80px; padding: 6px 0; border: 3px solid #3d4e52; background: #0d1417; color: #cfd9d3; font: bold 30px Arial, sans-serif; text-align: center; pointer-events: none; }

      .room-interior::after { content: ''; position: absolute; top: 44px; left: 0; right: 0; height: 10px; background: repeating-linear-gradient(90deg, transparent 0 180px, #3c4a50 180px 300px); }
      .room-door { position: absolute; pointer-events: none; border: 6px solid #3a4a50; border-bottom: 0; background: linear-gradient(90deg, transparent 78%, #6d7f86 78% 82%, transparent 82%), linear-gradient(#22343c, #16242a); box-shadow: inset 0 0 0 4px #121b1f; }
      .room-door.near { outline: 2px solid #96b7aa; }
      #floor17-extension { position: absolute; inset: 0; display: none; pointer-events: none; }
      #world[data-room="corridor"] #floor17-extension { display: block; }
      #floor17-extension > img { position: absolute; left: 3200px; top: 0; width: 1800px; height: 785.39px; image-rendering: pixelated; }
      #floor17-extension .art-door { border: 0; background: none; box-shadow: none; }
      #floor17-hydrant { position: absolute; left: 4023px; top: 248px; width: 145px; height: 220px; }
      #floor17-hydrant.near { outline: 2px solid #96b7aa; }
      #dynamic-scene[data-art="true"] .room-door.metal { border: 6px solid #555f66; border-bottom: 0; background: linear-gradient(90deg, #303a40 78%, #8e989e 78% 82%, #303a40 82%); }
      #world[data-dark="true"][data-room="dynamic"] #darkness { display: block; }
      .crate { background: linear-gradient(90deg, transparent 44%, #b89a6a 44% 56%, transparent 56%), #6b5238; border: 4px solid #8a6b4a; box-shadow: inset 0 0 0 3px #4d3a28; }
      #dynamic-scene[data-theme="warm"] > .floor { background: #211a15; border-top-color: #6d5a48; }
      #dynamic-scene[data-theme="warm"] .floor-room { border-color: #4a3b30; background: linear-gradient(#2a211b, #1f1813); }
      #dynamic-scene[data-theme="warm"] .floor-room-sign { border-color: #6b5341; background: #19120e; color: #d6c3a6; }
      #dynamic-scene[data-theme="warm"] .floor-number-sign { border-color: #6b5341; background: #19120e; color: #e2d2b8; }
      #dynamic-scene .floor-room.solid-wall { background: repeating-linear-gradient(90deg, #2c241e 0 118px, #231c17 118px 122px); }
      #dynamic-scene .floor-room.solid-wall::before { display: none; }
      #dynamic-scene .floor-room.restroom { background: linear-gradient(transparent 55%, #2c3a3f 55% 56%, transparent 56%), repeating-linear-gradient(90deg, #1d2a2e 0 46px, #172226 46px 48px), repeating-linear-gradient(#1d2a2e 0 46px, #172226 46px 48px); background-blend-mode: normal, multiply, normal; }
      #dynamic-scene .floor-room.restroom::before { display: none; }
      #dynamic-scene .floor-room.panel { background: linear-gradient(transparent 62%, #3a2b20 62% 63%, transparent 63%), repeating-linear-gradient(90deg, #35281f 0 150px, #2b2019 150px 154px); }
      #dynamic-scene .floor-room.panel::before { top: 40px; left: 60px; right: 60px; height: 110px; border-color: #5a4636; }
      #dynamic-scene .floor-room.open { background: linear-gradient(#2f251d, #231b15); }
      #dynamic-scene .floor-room.open::before { top: 30px; left: 40px; right: 40px; height: 230px; border-color: #5a4636; }
      .room-door.wood { border-color: #6b5341; background: linear-gradient(90deg, transparent 80%, #b59a6a 80% 84%, transparent 84%), repeating-linear-gradient(#4a3526 0 40px, #3f2d20 40px 44px); box-shadow: inset 0 0 0 4px #2a1d14; }
      .room-door.metal { border-color: #555f66; background: linear-gradient(transparent 10%, #1b2124 10% 20%, transparent 20%), linear-gradient(90deg, transparent 80%, #8e989e 80% 84%, transparent 84%), linear-gradient(#3a4146, #2a3034); box-shadow: inset 0 0 0 4px #20262a; }
      .room-door.glass { border-color: #45565c; background: linear-gradient(90deg, transparent 74%, #a3b6bc 74% 77%, transparent 77%), linear-gradient(105deg, #2a4350 0 28%, #182b35 28%); box-shadow: inset 0 0 0 4px #121b1f; }
      .room-door.double { border-color: #6b5341; background: linear-gradient(90deg, transparent 47%, #6b5341 47% 53%, transparent 53%), linear-gradient(#2a3a3e, #1c2629); box-shadow: inset 0 0 0 4px #2a1d14; }
      #dynamic-scene[data-theme="warm"] .room-interior { background: linear-gradient(#150f0c 0 44px, #3a2d24 44px 50px, #2a211b 50px 420px, #33271f 420px 424px, #241b15 424px); }
      #dynamic-scene[data-theme="warm"] .room-interior::before { border-color: #5a4636; }
      .room-interior.windowless { background: linear-gradient(#0c0a09 0 44px, #26221e 44px 50px, transparent 50px), repeating-linear-gradient(90deg, #1c1916 0 200px, #151210 200px 206px) !important; }
      .room-interior.windowless::before { display: none; }
      .floor-prop { position: absolute; pointer-events: none; image-rendering: pixelated; }
      .floor-prop img { display: block; width: 100%; height: 100%; }
      .floor-prop.near { outline: 2px solid #96b7aa; }
      .floor-background { position: absolute; left: 0; pointer-events: none; user-select: none; image-rendering: pixelated; }
      #dynamic-scene[data-art="true"] > .solid:not(.crate),
      #dynamic-scene[data-art="true"] .room-interior { visibility: hidden; }
      #dynamic-scene[data-art="true"] .floor-room { top: 300px; height: 270px; border: 0; background: none; }
      #dynamic-scene[data-art="true"] .floor-room::before { content: none; }
      #dynamic-scene[data-art="true"] .room-door { border: 0; background: none; box-shadow: none; }
      #dynamic-scene[data-art="true"] .floor-number-sign { top: 282px; }
      #dynamic-scene[data-art="true"] .floor-prop img { filter: brightness(.68) saturate(.8); }
      #world[data-room="dynamic"] #dynamic-scene { display: block; }
      #world[data-room="dynamic"] #background,
      #world[data-room="dynamic"] #office-background,
      #world[data-room="dynamic"] > .solid,
      #world[data-room="dynamic"] > .door,
      #world[data-room="dynamic"] > .office-door,
      #world[data-room="dynamic"] > .elevator-indicator { display: none; }
      .office-door { position: absolute; pointer-events: none; }
      .office-door.near { outline: 2px solid #96b7aa; }
      .door { position: absolute; overflow: hidden; pointer-events: none; image-rendering: pixelated; }
      .door img { display: block; width: 200%; height: 100%; max-width: none; }
      .door[data-open="true"] img { transform: translateX(-50%); }
      .door.elevator img { transform: translateX(-50%); }
      .elevator-panels { position: absolute; inset: 0; clip-path: inset(6.5% 12% 4.5%); }
      .elevator-panels::before, .elevator-panels::after { content: ''; position: absolute; inset: 0; background: url('assets/objects/floor17/elevator.png') 0 0 / 200% 100% no-repeat; transition: transform 1.4s cubic-bezier(.45, 0, .2, 1); }
      .elevator-panels::before { clip-path: inset(6.5% 50% 4.5% 12%); }
      .elevator-panels::after { clip-path: inset(6.5% 12% 4.5% 50%); }
      .elevator[data-open="true"] .elevator-panels::before { transform: translateX(-38%); }
      .elevator[data-open="true"] .elevator-panels::after { transform: translateX(38%); }
      .door.near { outline: 2px solid #96b7aa; }
      .elevator-indicator { position: absolute; transform: translateX(-50%); width: 86px; height: 26px; border: 2px solid #293b40; background: #081013; color: #9fd5ba; font: bold 19px/22px monospace; text-align: center; text-shadow: 0 0 5px #578873; pointer-events: none; }
      #interaction-hint { position: absolute; z-index: 2; transform: translateX(-50%); padding: 6px 10px; background: #101b20; border: 1px solid #96b7aa; pointer-events: none; white-space: nowrap; }
      #interaction-status { position: absolute; bottom: 24px; width: 100%; text-align: center; text-shadow: 0 2px 4px #000; pointer-events: none; }
      #room-transition { position: fixed; inset: 0; z-index: 20; background: #000; opacity: 0; pointer-events: none; }
      #room-transition.visible { pointer-events: auto; }
      .solid { position: absolute; }
      .boundary { background: #172126; border-inline: 4px solid #2b383e; }
      .desk { background: #5c5346; border: 5px solid #8f8168; box-shadow: inset 0 -8px #40392f; }
      .desk::after { content: ''; position: absolute; top: 10px; left: 14px; width: 40%; height: 18px; background: #2f6b63; box-shadow: 0 0 6px #3fa696; }
      .rig { background: #37524f; border: 5px solid #5f8b85; box-shadow: inset 0 -8px #233a38; }
      .rig::after { content: ''; position: absolute; top: 10px; left: 10px; right: 10px; height: 6px; background: #79e0c9; box-shadow: 0 0 6px #79e0c9; }
      .server-rack { background: #14181f; border: 5px solid #37414f; box-shadow: inset 0 -10px #05070a; }
      .server-rack::after { content: ''; position: absolute; top: 12px; left: 10px; width: 14px; height: 14px; background: #4fd6ff; border-radius: 50%; box-shadow: 0 0 8px #4fd6ff, 0 24px 0 #4fd6ff, 0 48px 0 #ff5c5c; }
      .hvac { background: #6b7278; border: 5px solid #9aa2a8; box-shadow: inset 0 -8px #4a4f53; }
      .hvac::after { content: ''; position: absolute; inset: 10px; border: 3px solid #454b4f; }
      .panel { position: absolute; pointer-events: none; background: #23343a; border: 4px solid #4c6b63; }
      .panel::after { content: ''; position: absolute; top: 10px; left: 10px; right: 10px; height: 16px; background: #7fd9c2; box-shadow: 0 0 8px #7fd9c2; }
      .panel.near { outline: 2px solid #96b7aa; }
      #player { position: absolute; top: 0; left: 0; width: 192px; height: 192px; overflow: hidden; image-rendering: pixelated; user-select: none; pointer-events: none; }
      #player img { display: none; width: 100%; height: 100%; }
      #player #idle-sprite { width: 357.39px; height: 357.39px; transform: translate(3.375px, 1.585px); clip-path: inset(0 50% 50% 0); }
      #player #walk-sheet { width: 600%; height: 100%; }
      #player #run-sheet { width: 800%; height: 100%; }
      #player .action-sheet { width: 200%; height: 100%; }
      #player[data-state="idle"] #idle-sprite,
      #player[data-state="walk"] #walk-sheet,
      #player[data-state="run"] #run-sheet,
      #player[data-state="jump"] #jump-sheet,
      #player[data-state="fall"] #jump-sheet,
      #player[data-state="interact"] #interact-sheet { display: block; }
      #interact-sheet { position: relative; top: -4px; }
      header { position: absolute; inset: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) auto max(24px, env(safe-area-inset-left)); display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
      header strong { font-size: 18px; font-weight: 600; }
      header span { color: #b8c6c0; font-size: 13px; }
      #floor17-light-switch { display: flex; align-items: center; gap: 6px; min-height: 32px; font-size: 13px; white-space: nowrap; pointer-events: auto; cursor: pointer; }
      #floor17-light-switch[hidden] { display: none; }
      #floor17-lights { width: 18px; height: 18px; margin: 0; accent-color: #b9d0a6; cursor: pointer; }
      #floor17-lights:focus-visible { outline: 2px solid #e2e9cc; outline-offset: 3px; }
      nav { position: absolute; inset: auto max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); display: flex; gap: 12px; }
      nav button { width: 56px; height: 52px; flex-shrink: 0; padding: 0; border: 1px solid #6b6d70; border-radius: 4px; background: #252629; color: #e5e7e9; font: 24px Arial, sans-serif; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
      #interact { margin-left: auto; font-size: 18px; }
      nav button:hover { border-color: #b9c6cf; }
      nav button.active, nav button:active { background: #bdd1dc; color: #22282e; }
      nav button:focus-visible { outline: 2px solid #c9dde5; outline-offset: 4px; }
      @media (max-height: 480px) {
        nav { bottom: max(12px, env(safe-area-inset-bottom)); }
        nav button { width: 48px; height: 44px; }
      }
    </style>
    <script src="assets/vendor/matter.min.js" defer></script>
    <script src="computer-documents.js" defer></script>
    <script src="player.js" defer></script>
  </head>
  <body>
    <main id="stage" tabindex="-1" aria-label="ARCHI 17층 사무실 사이드뷰 스테이지">
      <div id="world" data-room="office" data-floor="17" data-lights="on">
        <div id="darkness" aria-hidden="true"></div>
        <div id="background" aria-hidden="true"></div>
        <div id="floor17-extension">
          <img src="assets/background/floor17/service-corridor.png" alt="" draggable="false" />
          <div id="floor17-hydrant" role="img" aria-label="소화전과 소화기"></div>
        </div>
        <img id="office-background" src="assets/background/floor17/office-interior-aligned.png" alt="" width="2196" height="724" draggable="false" />
        <div id="office-computer" role="img" aria-label="켜진 컴퓨터"></div>
        <div id="dynamic-scene" aria-hidden="true"></div>
        <div id="interaction-hint" hidden></div>
        <div id="player" role="img" aria-label="정수호" data-state="idle" data-frame="0">
          <img id="idle-sprite" src="assets/player/jeong-suho-idle-four.png" alt="" width="1254" height="1254" draggable="false" />
          <img id="walk-sheet" src="assets/player/jeong-suho-walk-six.png" alt="" width="1536" height="256" draggable="false" />
          <img id="run-sheet" src="assets/player/jeong-suho-run-eight.png" alt="" width="2048" height="256" draggable="false" />
          <img id="jump-sheet" class="action-sheet" src="assets/player/jeong-suho-jump-fall.png" alt="" width="1774" height="887" draggable="false" />
          <img id="interact-sheet" class="action-sheet" src="assets/player/jeong-suho-interact.png" alt="" width="1774" height="887" draggable="false" />
        </div>
      </div>
      <header><strong>ARCHI</strong><span>17F · 사무실</span><label id="floor17-light-switch"><input id="floor17-lights" type="checkbox" checked aria-label="17층 조명" /><output id="floor17-light-state">조명 켜짐</output></label></header>
      <nav aria-label="플레이어 조작">
        <button type="button" data-direction="-1" aria-label="왼쪽 이동" title="왼쪽 이동 (A / ←)">←</button>
        <button type="button" data-direction="1" aria-label="오른쪽 이동" title="오른쪽 이동 (D / →)">→</button>
        <button id="interact" type="button" aria-label="상호작용" title="상호작용 (E)">E</button>
        <button id="jump" type="button" aria-label="점프" title="점프 (Space / W / ↑)">↑</button>
      </nav>
      <div id="interaction-status" role="status" aria-live="polite"></div>
    </main>
    <div id="room-transition" aria-hidden="true" data-phase="idle"></div>
    <div id="computer" role="dialog" aria-modal="true" aria-label="17층 사무실 컴퓨터" tabindex="-1" hidden>
      <img id="computer-wallpaper" src="assets/ui/computer/wallpaper.png" alt="" draggable="false" />
      <div class="computer-shortcuts">
        <button type="button" data-computer-app="files"><img src="assets/vendor/lucide/folder.svg" alt="" /><span>파일</span></button>
        <button type="button" data-computer-app="notes"><img src="assets/vendor/lucide/notebook-pen.svg" alt="" /><span>업무 메모</span></button>
      </div>
      <section id="computer-window" aria-labelledby="computer-window-title" hidden>
        <div class="computer-titlebar">
          <strong id="computer-window-title">파일</strong>
          <button id="computer-window-close" type="button" aria-label="창 닫기" title="창 닫기"><img src="assets/vendor/lucide/x.svg" alt="" /></button>
        </div>
        <div id="computer-files" class="computer-content" hidden>
          <p class="computer-path">내 컴퓨터 / 사내 공유 / ARCHI</p>
          <div class="computer-file-filters">
            <label>검색<input id="computer-search" type="search" aria-label="문서 검색" /></label>
            <label>분류<select id="computer-category" aria-label="문서 분류"><option value="">전체 자료</option><option>회사·조직</option><option>프로젝트</option><option>시설·보안</option></select></label>
          </div>
          <p id="computer-file-count" role="status" aria-live="polite"></p>
          <div id="computer-file-list"></div>
          <p id="computer-files-empty" hidden>일치하는 문서가 없습니다.</p>
          <button type="button" data-computer-app="notes"><img src="assets/vendor/lucide/notebook-pen.svg" alt="" /><span>업무 메모</span></button>
        </div>
        <div id="computer-notes" class="computer-content" hidden>
          <div class="computer-toolbar">
            <button id="computer-save" type="button" aria-label="메모 저장" title="메모 저장"><img src="assets/vendor/lucide/save.svg" alt="" /></button>
            <output id="computer-save-status" role="status" aria-live="polite">저장됨</output>
          </div>
          <textarea id="computer-note" aria-label="업무 메모 내용" spellcheck="false"></textarea>
        </div>
        <div id="computer-document" class="computer-content" hidden>
          <div class="computer-toolbar"><button type="button" data-computer-app="files" aria-label="파일 목록으로" title="파일 목록으로"><img src="assets/vendor/lucide/arrow-left.svg" alt="" /></button></div>
          <div id="computer-document-scroll" tabindex="0" aria-label="문서 본문">
            <article class="company-document">
              <div class="document-letterhead"><strong>ARCHI</strong><span>INTERNAL · 사내 자료</span></div>
              <p id="computer-document-code"></p>
              <h1 id="computer-document-title"></h1>
              <p id="computer-document-meta"></p>
              <div id="computer-document-body"></div>
              <footer>ARCHI PROJECT OFFICE · 내부 열람용</footer>
            </article>
          </div>
        </div>
      </section>
      <div class="computer-taskbar">
        <strong>ARCHI</strong>
        <button type="button" data-computer-app="files" aria-label="파일" title="파일"><img src="assets/vendor/lucide/folder.svg" alt="" /></button>
        <button type="button" data-computer-app="notes" aria-label="업무 메모" title="업무 메모"><img src="assets/vendor/lucide/notebook-pen.svg" alt="" /></button>
        <span>17F · PC-01</span>
        <button id="computer-exit" type="button" aria-label="컴퓨터 사용 종료" title="컴퓨터 사용 종료"><img src="assets/vendor/lucide/log-out.svg" alt="" /></button>
      </div>
    </div>
    <div id="elevator-cabin" role="dialog" aria-modal="true" aria-label="엘리베이터 내부" tabindex="-1" hidden>
      <div id="cabin-scene" data-door="closed">
        <img id="cabin-art" src="assets/background/elevator/cabin-b2-to-17.png" width="1536" height="1024" alt="" draggable="false" />
        <div id="cabin-doorway"><div class="cabin-leaf left"></div><div class="cabin-leaf right"></div></div>
        <output id="cabin-display" aria-label="현재 층">17</output>
        <div id="cabin-floor-buttons"></div>
