      #dynamic-scene[data-theme="atrium"] > .floor { background: linear-gradient(90deg, #332e26 0 2px, transparent 2px) 0 0 / 180px 100%, linear-gradient(#2e2a22 0 6px, transparent 6px), #25221d; border-top-color: #b09358; }

      #dynamic-scene .floor-room.restroom::before { display: none; }
      #dynamic-scene .floor-room.panel { background: linear-gradient(transparent 62%, #3a2b20 62% 63%, transparent 63%), repeating-linear-gradient(90deg, #35281f 0 150px, #2b2019 150px 154px); }
      #dynamic-scene .floor-room.panel::before { top: 40px; left: 60px; right: 60px; height: 110px; border-color: #5a4636; }

      #dynamic-scene .floor-room.frosted::before { top: 24px; left: 20px; right: 20px; height: 150px; border-color: #3a414a; }
      #dynamic-scene .floor-room.lab { background: radial-gradient(circle, #0b0d10 0 1.6px, transparent 2px) 0 0 / 12px 12px, linear-gradient(#2a2f36, #22262c); }

      #dynamic-scene .floor-room.lab::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: repeating-linear-gradient(135deg, #3b3522 0 14px, #1b1c1f 14px 28px); }
      #dynamic-scene .floor-room.blinds { background: linear-gradient(#1d2127, #15181c); }

      .room-door.slide { border-color: #4a535d; background: linear-gradient(90deg, transparent 49%, #4a535d 49% 51%, transparent 51%), linear-gradient(90deg, transparent 43%, #7f8a96 43% 45%, transparent 45% 55%, #7f8a96 55% 57%, transparent 57%), linear-gradient(110deg, #22303a 0 30%, #19222b 30% 62%, #1f2a34 62%); box-shadow: inset 0 0 0 4px #14171b; }
      .room-door.slide::before { content: ''; position: absolute; top: -26px; left: 50%; width: 64px; height: 12px; margin-left: -34px; border: 2px solid #4a535d; background: linear-gradient(90deg, transparent 80%, #3a1c1c 80% 90%, transparent 90%), #22262c; }
      .room-door.security { border-color: #5a626c; background: linear-gradient(90deg, transparent 80%, #9aa3ad 80% 84%, transparent 84%), repeating-linear-gradient(#3b4148 0 58px, #33383e 58px 62px); box-shadow: inset 0 0 0 4px #1e2226; }
      .room-door.security::after { content: ''; position: absolute; top: 120px; right: -34px; width: 16px; height: 28px; border: 2px solid #5a626c; background: radial-gradient(circle at 50% 28%, #5a1f1f 0 3px, transparent 4px), #15181c; }
      .room-door.blinds { border-color: #4f4a44; background: radial-gradient(circle at 84% 58%, #0a0a0a 0 3px, transparent 4px), linear-gradient(90deg, transparent 80%, #b9b2a4 80% 85%, transparent 85%), repeating-linear-gradient(#59616b 0 6px, #373d44 6px 8px, #1f2328 8px 11px); box-shadow: inset 0 0 0 4px #1a1c1f; }
      #dynamic-scene[data-theme="lab"] .room-interior { background: linear-gradient(#0e1013 0 44px, #2b3038 44px 50px, #1a1d22 50px 420px, #262a31 420px 424px, #16181c 424px); }
      #dynamic-scene[data-theme="lab"] .room-interior::before { border-color: #353c45; }
      #dynamic-scene[data-theme="lab"] .room-interior::after { background: repeating-linear-gradient(90deg, transparent 0 220px, #3a414b 220px 360px); }
      #dynamic-scene[data-theme="lab"] .room-interior.windowless { background: linear-gradient(#0b0c0f 0 44px, #2a2f36 44px 50px, transparent 50px), radial-gradient(circle, #0b0d10 0 1.6px, transparent 2px) 0 0 / 12px 12px, linear-gradient(#23272d, #1c1f24) !important; }

      #dynamic-scene[data-theme="food"] .room-interior { background: linear-gradient(#12100d 0 44px, #3a352b 44px 50px, #26231d 50px 420px, #312d25 420px 424px, #1f1c17 424px); }
      #dynamic-scene[data-theme="food"] .room-interior::before { border-color: #4d4536; }

      #dynamic-scene .floor-room.kitchen::after { content: ''; position: absolute; top: 236px; left: 40px; width: 220px; height: 64px; border: 3px solid #5a4f3c; background: repeating-linear-gradient(#2c2820 0 10px, #3a3428 10px 12px); }
      #dynamic-scene .floor-room.store { background: linear-gradient(#211f26, #18161c); }

      #dynamic-scene .floor-room.cafe { background: repeating-linear-gradient(90deg, #36291e 0 18px, #2d2219 18px 22px); }

      .room-door.cafeteria { border-color: #5d5444; background: linear-gradient(90deg, transparent 49%, #5d5444 49% 51%, transparent 51%), linear-gradient(transparent 46%, #a89a7c 46% 48%, transparent 48%), linear-gradient(110deg, #283238 0 30%, #1c2428 30%); box-shadow: inset 0 0 0 4px #15130f; }

      /* 16층은 용도별 문 스프라이트를 복도와 방 안쪽에 함께 쓴다. CU 시트: 왼쪽 잠김 / 오른쪽 해제. */

      #dynamic-scene[data-theme="food"] .room-door.shutter::before { content: none; }
      #dynamic-scene[data-theme="food"] .room-door.metal { background-image: url('assets/objects/floor16/restroom-door.png'); }
      #dynamic-scene[data-theme="food"] .room-door.cafe { background-image: url('assets/objects/floor16/cafe-door.png'); }
