<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ARCHI | 정수호</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #303133; color: #eee; }
      #stage { position: relative; width: 100%; height: 100dvh; overflow: hidden; touch-action: none; }
      #player { position: absolute; top: 50%; width: min(256px, 64vw, 65dvh); aspect-ratio: 1; overflow: hidden; image-rendering: pixelated; user-select: none; pointer-events: none; }
      #player img { display: block; width: 100%; height: 100%; }
      #player #walk-sheet { width: 400%; height: 100%; }
      #player[data-state="idle"] #walk-sheet, #player[data-state="walk"] #idle-sprite { display: none; }
      nav { position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 12px; }
      button { width: 52px; height: 48px; padding: 0; border: 1px solid #6b6d70; border-radius: 4px; background: #252629; color: #e5e7e9; font: 24px Arial, sans-serif; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
      button:hover { border-color: #b9c6cf; }
      button.active, button:active { background: #bdd1dc; color: #22282e; }
      button:focus-visible { outline: 2px solid #c9dde5; outline-offset: 4px; }
    </style>
    <script src="player.js" defer></script>
  </head>
  <body>
    <main id="stage" aria-label="정수호 플레이어">
      <div id="player" role="img" aria-label="정수호" data-state="idle" data-frame="0">
        <img id="idle-sprite" src="assets/player/jeong-suho.png" alt="" width="256" height="256" draggable="false" />
        <img id="walk-sheet" src="assets/player/jeong-suho-walk.png" alt="" width="1024" height="256" draggable="false" />
      </div>
      <nav aria-label="플레이어 이동">
        <button type="button" data-direction="-1" aria-label="왼쪽 이동" title="왼쪽 이동 (A / ←)">←</button>
        <button type="button" data-direction="1" aria-label="오른쪽 이동" title="오른쪽 이동 (D / →)">→</button>
      </nav>
    </main>
  </body>
</html>
