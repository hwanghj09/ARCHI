<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ARCHI | 정수호</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; overflow: hidden; background: #27292b; color: #eee; font: 14px Arial, sans-serif; }
      #stage { position: relative; width: 100%; height: 100dvh; overflow: hidden; touch-action: none; }
      #world { position: absolute; transform-origin: top left; background: #151f25; }
      #background { position: absolute; inset: 0; overflow: hidden; pointer-events: none; user-select: none; }
      #background img { position: absolute; width: 256px; height: 256px; image-rendering: pixelated; }
      #office-background { display: none; position: absolute; pointer-events: none; user-select: none; image-rendering: pixelated; }
      #world[data-room="office"] #office-background { display: block; }
      #world[data-room="office"] #background,
      #world[data-room="office"] .solid,
      #world[data-room="office"] .door,
      #world[data-room="office"] .elevator-indicator,
      #world[data-room="office"] .office-door[data-room="corridor"],
      #world[data-room="corridor"] .office-door[data-room="office"] { display: none; }
      .office-door { position: absolute; pointer-events: none; }
      .office-door.near { outline: 2px solid #96b7aa; }
      .door { position: absolute; overflow: hidden; pointer-events: none; image-rendering: pixelated; }
      .door img { display: block; width: 200%; height: 100%; max-width: none; }
      .door[data-open="true"] img { transform: translateX(-50%); }
      .door.near { outline: 2px solid #96b7aa; }
      .elevator-indicator { position: absolute; transform: translateX(-50%); width: 86px; height: 26px; border: 2px solid #293b40; background: #081013; color: #9fd5ba; font: bold 19px/22px monospace; text-align: center; text-shadow: 0 0 5px #578873; pointer-events: none; }
      #interaction-hint { position: absolute; z-index: 1; transform: translateX(-50%); padding: 6px 10px; background: #101b20; border: 1px solid #96b7aa; pointer-events: none; white-space: nowrap; }
      #interaction-status { position: absolute; bottom: 24px; width: 100%; text-align: center; text-shadow: 0 2px 4px #000; pointer-events: none; }
      #room-transition { position: absolute; inset: 0; z-index: 5; background: #000; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
      #room-transition.visible { opacity: 1; }
      .solid { position: absolute; }
      .boundary { background: #172126; border-inline: 4px solid #2b383e; }
      .crate { background: #77817a; border: 5px solid #a0a790; box-shadow: inset 0 -10px #5b6762; }
      .crate::after { content: ''; position: absolute; top: 8px; left: 12px; width: 34px; height: 8px; background: #d6bd6a; }
      .cabinet { background: #737f7b; border: 5px solid #a3ada2; box-shadow: inset 0 -6px #52645e; }
      .cabinet::after { content: ''; position: absolute; top: 14px; left: 40%; width: 20%; height: 4px; background: #273b38; }
      #player { position: absolute; top: 0; left: 0; width: 192px; height: 192px; overflow: hidden; image-rendering: pixelated; user-select: none; pointer-events: none; }
      #player img { display: none; width: 100%; height: 100%; }
      #player #walk-sheet { width: 600%; height: 100%; }
      #player .action-sheet { width: 200%; height: 100%; }
      #player[data-state="idle"] #idle-sprite,
      #player[data-state="walk"] #walk-sheet,
      #player[data-state="jump"] #jump-sheet,
      #player[data-state="fall"] #jump-sheet,
      #player[data-state="interact"] #interact-sheet { display: block; }
      #interact-sheet { position: relative; top: -4px; }
      header { position: absolute; inset: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) auto max(24px, env(safe-area-inset-left)); display: flex; justify-content: space-between; gap: 16px; pointer-events: none; }
      header strong { font-size: 18px; font-weight: 600; }
      header span { color: #b8c6c0; font-size: 13px; }
      nav { position: absolute; inset: auto max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); display: flex; gap: 12px; }
      nav button { width: 56px; height: 52px; flex-shrink: 0; padding: 0; border: 1px solid #6b6d70; border-radius: 4px; background: #252629; color: #e5e7e9; font: 24px Arial, sans-serif; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
      #interact { margin-left: auto; font-size: 18px; }
      nav button:hover { border-color: #b9c6cf; }
      nav button.active, nav button:active { background: #bdd1dc; color: #22282e; }
      nav button:focus-visible { outline: 2px solid #c9dde5; outline-offset: 4px; }
      @media (max-height: 480px) {
        nav { bottom: max(12px, env(safe-area-inset-bottom)); }
        nav button { width: 48px; height: 44px; }
      }
    </style>
    <script src="assets/vendor/matter.min.js" defer></script>
    <script src="player.js" defer></script>
  </head>
  <body>
    <main id="stage" aria-label="ARCHI 17층 사이드뷰 스테이지">
      <div id="world" data-room="corridor">
        <div id="background" aria-hidden="true"></div>
        <img id="office-background" src="assets/background/floor17/office-interior.png" alt="" width="2172" height="724" draggable="false" />
        <div id="interaction-hint" hidden></div>
        <div id="player" role="img" aria-label="정수호" data-state="idle" data-frame="0">
          <img id="idle-sprite" src="assets/player/jeong-suho.png" alt="" width="256" height="256" draggable="false" />
          <img id="walk-sheet" src="assets/player/jeong-suho-walk-six.png" alt="" width="1536" height="256" draggable="false" />
          <img id="jump-sheet" class="action-sheet" src="assets/player/jeong-suho-jump-fall.png" alt="" width="1774" height="887" draggable="false" />
          <img id="interact-sheet" class="action-sheet" src="assets/player/jeong-suho-interact.png" alt="" width="1774" height="887" draggable="false" />
        </div>
      </div>
      <header><strong>ARCHI</strong><span>17F · 00:00</span></header>
      <nav aria-label="플레이어 조작">
        <button type="button" data-direction="-1" aria-label="왼쪽 이동" title="왼쪽 이동 (A / ←)">←</button>
        <button type="button" data-direction="1" aria-label="오른쪽 이동" title="오른쪽 이동 (D / →)">→</button>
        <button id="interact" type="button" aria-label="상호작용" title="상호작용 (E)">E</button>
        <button id="jump" type="button" aria-label="점프" title="점프 (Space / W / ↑)">↑</button>
      </nav>
      <div id="interaction-status" role="status" aria-live="polite"></div>
      <div id="room-transition" aria-hidden="true"></div>
    </main>
  </body>
</html>
